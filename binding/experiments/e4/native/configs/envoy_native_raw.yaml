# E4 native-ACL (W12): Envoy authorizes admin with its OWN RBAC filter (path prefix),
# plus the real bh-verifier ext_authz for the DPoP proof. Variant: raw
#   raw : normalize_path off (vendor default) -> RBAC sees the RAW path -> a /../ traversal
#         to admin is NOT matched by the prefix -> RBAC allows -> BYPASS (backend resolves).
#   norm: normalize_path on (recommended)     -> RBAC sees the NORMALISED path -> admin
#         prefix matches -> RBAC denies -> SOUND.
admin:
  address: {socket_address: {address: 127.0.0.1, port_value: 9901}}
static_resources:
  listeners:
  - name: main
    address: {socket_address: {address: 0.0.0.0, port_value: 8000}}
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: ingress
          codec_type: AUTO
          normalize_path: false
          route_config:
            name: local
            virtual_hosts:
            - name: api
              domains: ["*"]
              routes:
              - match: {prefix: "/api/"}
                route: {cluster: executor, timeout: 10s}
          http_filters:
          - name: envoy.filters.http.rbac
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBAC
              rules:
                action: DENY
                policies:
                  admin-deny:
                    permissions:
                    - url_path: {path: {prefix: "/api/v1/admin"}}
                    - url_path: {path: {prefix: "/api/v2/admin"}}
                    principals:
                    - any: true
          - name: envoy.filters.http.ext_authz
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
              transport_api_version: V3
              failure_mode_allow: false
              allowed_headers:
                patterns:
                - {exact: authorization, ignore_case: true}
                - {exact: dpop, ignore_case: true}
              http_service:
                server_uri: {uri: "http://verifier:9100", cluster: verifier, timeout: 3s}
                path_prefix: /authz/envoy
                authorization_response:
                  allowed_upstream_headers:
                    patterns:
                    - {prefix: x-verified-, ignore_case: true}
                  allowed_client_headers:
                    patterns:
                    - {exact: www-authenticate, ignore_case: true}
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
  - name: executor
    type: STRICT_DNS
    connect_timeout: 2s
    load_assignment:
      cluster_name: executor
      endpoints:
      - lb_endpoints:
        - endpoint: {address: {socket_address: {address: executor, port_value: 8080}}}
  - name: verifier
    type: STRICT_DNS
    connect_timeout: 2s
    load_assignment:
      cluster_name: verifier
      endpoints:
      - lb_endpoints:
        - endpoint: {address: {socket_address: {address: verifier, port_value: 9100}}}
