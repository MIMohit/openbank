# E4 native-ACL (W12): NGINX authorizes with its OWN path rules (no external PDP).
# The real bh-verifier still checks the DPoP proof (edge auth_request); the authorization
# (admin deny + ownership) is done NATIVELY by nginx `location` rules. nginx matches
# locations on the NORMALISED, %-decoded, dot-segment-resolved URI, so a `/../` traversal
# that defeats a raw-view external PDP is caught here. This file demonstrates that a
# native ACL evaluated on the routing view is sound where the raw-view PDP is not.
worker_processes 1;
error_log /dev/stderr info;
events { worker_connections 1024; }
http {
    access_log /dev/stdout;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server {
        listen 8000;
        server_name _;

        # ── native authorization (evaluated on nginx's normalised match URI) ──
        # admin is denied for everyone (alice is not an admin).
        location ~ ^/api/v[12]/admin(/|$) { return 403; }
        # ownership: any accounts/{id} whose id is not alice's is denied.
        location ~ ^/api/v[12]/accounts/(?!acc-alice-1(/|$))[^/]+ { return 403; }

        # ── proof check + proxy for everything else under /api/ ──
        location /api/ {
            auth_request /_bh_authz;
            auth_request_set $bh_sub $upstream_http_x_verified_sub;
            proxy_set_header X-Verified-Sub $bh_sub;
            proxy_pass http://executor:8080;
        }
        location = /_bh_authz {
            internal;
            proxy_pass http://verifier:9100/authz/orig;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-Method $request_method;
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header X-Original-Host $host;
            proxy_set_header X-Original-Proto $scheme;
        }
    }
}
