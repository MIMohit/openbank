services:
  verifier:
    image: python:3.12-slim
    container_name: w21-cap-verifier
    environment: {ROLE: verifier, PORT: "9100", LOG_PATH: /logs/verifier.jsonl}
    command: ["python3", "-I", "/app/capture_server.py"]
    volumes:
      - ./capture/capture_server.py:/app/capture_server.py:ro
      - ./logs:/logs
    networks: [bench]
  executor:
    image: python:3.12-slim
    container_name: w21-cap-executor
    environment: {ROLE: upstream, PORT: "8080", LOG_PATH: /logs/executor.jsonl}
    command: ["python3", "-I", "/app/capture_server.py"]
    volumes:
      - ./capture/capture_server.py:/app/capture_server.py:ro
      - ./logs:/logs
    networks: [bench]
  gateway:
    image: apache/apisix:3.21.0-debian
    container_name: w21-apisix-gw
    environment: {APISIX_STAND_ALONE: "true"}
    volumes:
      - ./apisix-conf/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ./apisix-conf/apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro
    ports:
      - "18021:8000"
    depends_on: [verifier, executor]
    networks: [bench]
networks:
  bench: {name: w21-bench}
