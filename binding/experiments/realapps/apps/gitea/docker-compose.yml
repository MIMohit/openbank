name: w22-gitea
services:
  app:
    image: gitea/gitea:1.22.6
    container_name: w22-gitea-app
    mem_limit: 768m
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__database__DB_TYPE: "sqlite3"
      GITEA__server__DOMAIN: "api.bench.test"
      GITEA__server__ROOT_URL: "http://api.bench.test/"
      GITEA__server__HTTP_PORT: "3000"
      GITEA__log__LEVEL: "Info"
      GITEA__service__REQUIRE_SIGNIN_VIEW: "false"
      GITEA__service__DISABLE_REGISTRATION: "true"
      GITEA__repository__DEFAULT_PRIVATE: "public"
    volumes:
      - w22-gitea-data:/data
  verifier:
    image: bh-verifier:latest
    container_name: w22-gitea-verifier
    mem_limit: 256m
    environment:
      HTU_CANON: "rfc3986"
      JTI_CACHE: "on"
      IAT_WINDOW: "60"
      VIEW_MAC: "off"
      AS_PUB_JWK: "/keys/as_pub.jwk"
      LOG_PATH: "/logs/verifier.jsonl"
    volumes:
      - /Users/mimohit/openbank/binding/harness/keys:/keys:ro
      - ./logs:/logs
  gateway:
    image: nginx:1.30.7-alpine
    container_name: w22-gitea-gw
    mem_limit: 256m
    depends_on: [app, verifier]
    ports:
      - "127.0.0.1:18100:8000"
    volumes:
      - ./gw/nginx.conf:/etc/nginx/nginx.conf:ro
    command: ["nginx", "-g", "daemon off;"]
volumes:
  w22-gitea-data:
    name: w22-gitea-data
