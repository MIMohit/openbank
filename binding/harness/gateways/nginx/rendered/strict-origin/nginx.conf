# GENERATED by gateways/nginx/render.py  profile=strict placement=origin
worker_processes 1;
error_log /dev/stderr info;
events { worker_connections 1024; }
http {
    access_log /dev/stdout;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server_tokens off;
    merge_slashes on;
    underscores_in_headers off;
    ignore_invalid_headers on;
    client_max_body_size 1m;
    server {
        listen 8000;
        server_name _;
        # strict: harness deny list over the raw path (no native toggle in NGINX)
        set $bh_raw_path $request_uri;
        if ($request_uri ~ "^([^?]*)") { set $bh_raw_path $1; }
        if ($bh_raw_path ~* "(%2f|%5c|%00|%3b|%25|%3f|%23|%2e|;|\\\\|/\\./|/\\.\\./|/\\.$|/\\.\\.$|//)") { return 400; }
        if ($request_method !~ "^(GET|HEAD|POST|PUT|DELETE|PATCH|OPTIONS)$") { return 405; }

        location /api/ {
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://executor:8080;
        }
    }
}
