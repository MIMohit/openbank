- id: g1-ct-urlencoded
  class: content-type-switch
  description: Keep a JSON body but relabel Content-Type as application/x-www-form-urlencoded (WAFFLED
    CT differential).
  source: 'WAFFLED: Exploiting Parsing Discrepancies to Bypass WAFs (Akhavani et al., arXiv:2503.10846)
    — security layer vs. framework content-type parsing differential.'
  applies_to:
    requires_tags:
    - with_body
  transform:
  - fn: set_content_type
    args:
      value: application/x-www-form-urlencoded
- id: g1-ct-textplain
