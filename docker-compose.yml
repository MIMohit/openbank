version: "3.9"

# Zero Trust Open Banking Testbed
# Bring up: docker compose up --build
# All services are LOCAL/SYNTHETIC — no real banking endpoints.

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:

  # ─── Identity Provider ───────────────────────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:26.4.4
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-admin_secret_local}
      KC_DB: dev-mem
      KC_HTTP_PORT: 8080
      KC_FEATURES: preview
      KC_HEALTH_ENABLED: "true"
      # Fixed hostname so issued tokens always carry the same `iss` claim
      # (http://keycloak:8080/realms/...) regardless of whether a client
      # reaches Keycloak via the internal Docker network (zt-controller) or
      # via localhost:8080 (host-run harness scripts, browser). Without this,
      # Keycloak derives `iss` from each request's Host header, and tokens
      # obtained via localhost fail token_verify.py's issuer check.
      KC_HOSTNAME: keycloak
      KC_HOSTNAME_PORT: "8080"
      KC_HOSTNAME_STRICT: "false"
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/realm-b0.json:/opt/keycloak/data/import/realm-b0.json:ro
      - ./keycloak/realm-fapi2.json:/opt/keycloak/data/import/realm-fapi2.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '\"status\": \"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks:
      - internal
    logging: *default-logging

  # ─── Policy Engine ───────────────────────────────────────────────────────────
  opa:
    image: openpolicyagent/opa:0.70.0-debug
    command: run --server --addr 0.0.0.0:8181 /policies
    volumes:
      - ./opa/policies:/policies:ro
    ports:
      - "8181:8181"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8181/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - internal
    logging: *default-logging

  # ─── Mock Resource Server ────────────────────────────────────────────────────
  mock-adr-api:
    build:
      context: ./mock-adr-api
      dockerfile: Dockerfile
    environment:
      MOCK_ADR_SEED: ${MOCK_ADR_SEED:-42}
      MOCK_ADR_NUM_USERS: ${MOCK_ADR_NUM_USERS:-100}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    expose:
      - "8000"
    # Not exposed to host — only accessible via ZT Controller (except B0 mode)
    networks:
      - internal
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *default-logging

  # ─── Zero Trust Controller (PEP+PDP) ─────────────────────────────────────────
  zt-controller:
    build:
      context: ./zt-controller
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      # NOTE: ZT_ENFORCE_DPOP / CHECK_DEVICE_BINDING / ENABLE_TELEMETRY /
      # ENABLE_RISK_POLICY / ENABLE_VELOCITY / PROXY_PASSTHROUGH are
      # intentionally passed through *bare* (no ":-default") below. Each
      # ZT_MODE (B0/B1/P) has its own coherent defaults for these in
      # app/config.py; a concrete default here would silently override that
      # per-mode selection for every mode (B0 would never actually become
      # the weak baseline). Only set them on the host/.env when deliberately
      # running an ablation (see README "Mode switching").
      ZT_MODE: ${ZT_MODE:-P}
      KEYCLOAK_URL: http://keycloak:8080
      OPA_URL: http://opa:8181
      MOCK_ADR_URL: http://mock-adr-api:8000
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ZT_ENFORCE_DPOP:
      ZT_CHECK_DEVICE_BINDING:
      ZT_ENABLE_TELEMETRY:
      ZT_ENABLE_RISK_POLICY:
      ZT_ENABLE_VELOCITY:
      ZT_PROXY_PASSTHROUGH:
      ZT_RISK_THRESHOLD_ALLOW: ${ZT_RISK_THRESHOLD_ALLOW:-0.4}
      ZT_RISK_THRESHOLD_DENY: ${ZT_RISK_THRESHOLD_DENY:-0.7}
      DPOP_SKEW_SECONDS: ${DPOP_SKEW_SECONDS:-60}
      JTI_CACHE_TTL_SECONDS: ${JTI_CACHE_TTL_SECONDS:-120}
    ports:
      - "9000:9000"
    volumes:
      - ./data:/app/data
    depends_on:
      keycloak:
        condition: service_healthy
      opa:
        condition: service_healthy
      mock-adr-api:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *default-logging

networks:
  internal:
    driver: bridge
